<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Global Pattern Browser</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">SCMG</p>
        <h1>Global Pattern Browser</h1>
      </div>
      <div class="counter" id="counter">Loading plots</div>
    </header>

    <main>
      <div class="layout">
        <div class="browser">
          <section class="search-panel" aria-label="Global pattern search">
            <div class="mode-switch" role="group" aria-label="Pattern type">
              <button class="mode-button" id="genesModeButton" type="button" data-mode="genes" aria-pressed="true">Genes</button>
              <button class="mode-button" id="cellTypesModeButton" type="button" data-mode="cellTypes" aria-pressed="false">Cell types</button>
            </div>
            <label id="searchLabel" for="searchInput">Search by gene name</label>
            <p class="search-note" id="searchNote" hidden></p>
            <div class="search-row">
              <input id="searchInput" type="search" autocomplete="off" placeholder="MYC, A1BG, PTGS2">
              <button id="clearButton" type="button">Clear</button>
            </div>
          </section>

          <section class="results-shell">
            <div class="results-head">
              <h2 id="resultsTitle">Plots</h2>
              <p id="resultsMeta"></p>
            </div>
            <div class="grid" id="resultsGrid" aria-live="polite"></div>
            <button class="load-more" id="loadMoreButton" type="button" hidden>Show more</button>
          </section>
        </div>

        <aside class="umap-panel" aria-label="Global cell type UMAP">
          <h2>Global Cell Type UMAP</h2>
          <button id="umapZoomButton" class="umap-zoom" type="button" aria-label="Open global cell type UMAP">
            <img src="https://huggingface.co/datasets/xingjiepan/SCMG_data/resolve/main/data/global_cell_type_umap.png" alt="Global cell type UMAP">
          </button>
        </aside>
      </div>
    </main>

    <dialog id="imageDialog" class="image-dialog">
      <button id="closeDialogButton" class="dialog-close" type="button" aria-label="Close image">Close</button>
      <div class="dialog-content">
        <div class="dialog-figures" id="dialogFigures">
          <figure>
            <img id="dialogImage" alt="">
            <figcaption id="dialogCaption"></figcaption>
          </figure>
          <figure class="comparison-figure" id="comparisonFigure" hidden>
            <img id="comparisonDialogImage" alt="">
            <figcaption id="comparisonDialogCaption"></figcaption>
          </figure>
        </div>
        <section class="related-panel" id="relatedPanel" aria-label="Related plots" hidden>
          <h2 id="relatedPanelTitle">Related plots</h2>
          <div class="related-list" id="relatedList"></div>
        </section>
      </div>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
